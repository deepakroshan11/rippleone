<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background radial glow -->
  <circle cx="100" cy="100" r="85" fill="url(#orbGlow)"/>
  <!-- Outer orbital ring -->
  <circle cx="100" cy="100" r="75" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
  <!-- Middle tilted orbit -->
  <ellipse cx="100" cy="100" rx="65" ry="32" stroke="#818CF8" stroke-width="2" transform="rotate(-30 100 100)" opacity="0.8"/>
  <ellipse cx="100" cy="100" rx="65" ry="32" stroke="#C084FC" stroke-width="2" transform="rotate(30 100 100)" opacity="0.8"/>
  <!-- Hexagonal processor base -->
  <polygon points="100,45 145,71 145,129 100,155 55,129 55,71" stroke="#38BDF8" stroke-width="2" fill="rgba(6,12,30,0.85)" filter="url(#aiGlow)"/>
  <!-- Inner Neural Core -->
  <circle cx="100" cy="100" r="24" fill="url(#coreGrad)" filter="url(#aiGlow)"/>
  <circle cx="100" cy="100" r="10" fill="#FFFFFF"/>
  <!-- Node dots -->
  <circle cx="100" cy="45" r="4" fill="#38BDF8"/>
  <circle cx="145" cy="71" r="4" fill="#818CF8"/>
  <circle cx="145" cy="129" r="4" fill="#C084FC"/>
  <circle cx="100" cy="155" r="4" fill="#38BDF8"/>
  <circle cx="55" cy="129" r="4" fill="#818CF8"/>
  <circle cx="55" cy="71" r="4" fill="#C084FC"/>
</svg>
