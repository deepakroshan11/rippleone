<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <filter id="cloudGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Cyber Hex Grid Node -->
  <polygon points="100,25 165,62 165,138 100,175 35,138 35,62" stroke="#3B82F6" stroke-width="2" fill="rgba(15,23,42,0.85)" filter="url(#cloudGlow)"/>
  <!-- Central Cloud Shape -->
  <path d="M75 118 C65 118 60 108 65 100 C62 90 72 82 82 85 C87 75 105 74 112 82 C120 78 132 85 130 96 C138 98 140 110 132 118 Z" 
        fill="url(#cloudGrad)" filter="url(#cloudGlow)"/>
  <!-- Code Terminal Prompt Chevron -->
  <path d="M88 100 L96 106 L88 112" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="102" y1="112" x2="114" y2="112" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Circuit Nodes -->
  <circle cx="100" cy="25" r="4" fill="#06B6D4"/>
  <circle cx="165" cy="62" r="4" fill="#3B82F6"/>
  <circle cx="165" cy="138" r="4" fill="#06B6D4"/>
  <circle cx="100" cy="175" r="4" fill="#3B82F6"/>
  <circle cx="35" cy="138" r="4" fill="#06B6D4"/>
  <circle cx="35" cy="62" r="4" fill="#3B82F6"/>
</svg>
